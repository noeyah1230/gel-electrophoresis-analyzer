[package]
name = "gel-notebook"
version = "0.1.0"
description = "Offline gel annotation and guarded linear DNA sizing"
authors = ["Gel Notebook"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
